name: "agent-trial"
description: "One-shot agent tool execution"

mode: ONCE
hostname: "sandbox"
cwd: "/workspace"

time_limit: 600

rlimit_as_type: SOFT
rlimit_cpu_type: SOFT
rlimit_fsize: 512
rlimit_nofile: 1024

clone_newuser: true
clone_newnet: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

# mount_proc disabled — Docker masks /proc entries (mounts /dev/null over
# /proc/kcore etc.) which breaks nsjail's procfs mount inside the container.
# One-shot tool commands don't need /proc.
mount_proc: false
keep_caps: false
skip_setsid: true

# Map caller uid (root in container) → root inside jail.
# The rootfs is python:3.12-slim which expects uid 0 for file access.
# Empty outside_id = use the calling process's uid.
uidmap {
  inside_id: "0"
  outside_id: ""
  count: 1
}

gidmap {
  inside_id: "0"
  outside_id: ""
  count: 1
}

# Rootfs is handled by --chroot CLI flag (set by NsjailBackend).
# Do NOT duplicate it here — nsjail handles chroot mount internally.

# Writable /tmp
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=256m"
}

# /dev essentials
mount {
  dst: "/dev"
  fstype: "tmpfs"
  rw: false
}

mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: false
}

mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: false
}

mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
  rw: false
}

mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: false
}

# /workspace bind mount is handled by --bindmount CLI flag at runtime.
# No seccomp_string — nsjail applies its built-in default filter.
